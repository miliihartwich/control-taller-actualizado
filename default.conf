# Redirección HTTP -> HTTPS
server {
    listen 80;
    server_name app.hartwich.com.uy;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS
server {
    listen 443 ssl http2;
    server_name app.hartwich.com.uy;

    # Certificados Let's Encrypt (montados desde el host en /etc/letsencrypt:ro)
    ssl_certificate     /etc/letsencrypt/live/app.hartwich.com.uy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hartwich.com.uy/privkey.pem;

    # Recomendaciones TLS básicas
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Archivos estáticos del build
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rutas -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend (servicio 'backend' del docker-compose)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;

        # timeouts razonables
        proxy_connect_timeout   60s;
        proxy_send_timeout      300s;
        proxy_read_timeout      300s;
    }
}

