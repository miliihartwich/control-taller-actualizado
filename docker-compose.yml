services:
  db:
    image: postgres:15
    container_name: postgres_controltaller
    restart: always
    environment:
      POSTGRES_DB: controltaller
      POSTGRES_USER: milagros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: backend_controltaller
    restart: always
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: gunicorn wsgi:app --bind 0.0.0.0:8000 --workers 1 --timeout 300 --log-level debug --access-logfile -

  # ---------- FRONTEND: DEV ----------
  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend_controltaller_dev
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
    profiles: ["dev"]

  # ---------- FRONTEND: PROD ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BASE: /
    container_name: frontend_controltaller
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    profiles: ["prod"]

volumes:
  postgres_data:
