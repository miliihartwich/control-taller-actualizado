# Redirige HTTP -> HTTPS
server {
  listen 80;
  server_name app.hartwich.com.uy;
  return 301 https://$host$request_uri;
}

# HTTPS
server {
  listen 443 ssl http2;
  server_name app.hartwich.com.uy;

  # Certs emitidos para el nuevo dominio
  ssl_certificate     /etc/letsencrypt/live/app.hartwich.com.uy/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.hartwich.com.uy/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy al backend
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket opcional:
    # proxy_set_header Upgrade $http_upgrade;
    # proxy_set_header Connection "upgrade";
  }
}

